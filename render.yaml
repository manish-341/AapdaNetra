services:
  # AI/ML Prediction Microservice (FastAPI + Retrained Govt Models + Live Weather Engine)
  - type: web
    name: aapdanetra-ai
    runtime: python
    rootDir: ai-services
    buildCommand: pip install -r requirement.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000

  # Backend API Web Service (Node.js / Express)
  - type: web
    name: aapdanetra
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: AI_SERVICE_URL
        value: https://aapdanetra-ai.onrender.com

  # Frontend Static Site (React / Vite)
  - type: static
    name: aapdanetra-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://aapdanetra.onrender.com/api
